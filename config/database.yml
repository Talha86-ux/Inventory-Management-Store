default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: db/development.sqlite3

# External Postgres DB used by InventoryRecord (keep as a top-level config)
inventory_store:
  adapter: postgresql
  url: <%= ENV["INVENTORY_STORE_DATABASE_URL"] %>
  pool: 5
  sslmode: require

test:
  <<: *default
  database: db/test.sqlite3

production:
  <<: *default
  database: db/production.sqlite3
